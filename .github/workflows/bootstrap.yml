name: Initialize Perfect Dental repository

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import the finished Perfect Dental site
        run: |
          curl --fail --location --output "$RUNNER_TEMP/source.tar.gz" https://github.com/isayara8-bot/Denta/archive/refs/heads/codex/perfect-dental-production.tar.gz
          mkdir "$RUNNER_TEMP/imported"
          tar -xzf "$RUNNER_TEMP/source.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/imported"
          rsync -a --delete --exclude='.git' --exclude='.github/workflows/bootstrap.yml' "$RUNNER_TEMP/imported/" ./
          git rm --force .github/workflows/bootstrap.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m 'feat: launch Perfect Dental website'
          git push
